<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 13px -apple-system, sans-serif; color: #d8d8d8; background: transparent; margin: 0; padding: 12px 8px; }
  label { display: flex; align-items: center; gap: 10px; }
  span { width: 90px; text-align: right; color: #969696; }
  select { flex: 1; background: #3d3d3d; color: #d8d8d8; border: 0; border-radius: 3px; padding: 4px; }
</style></head>
<body>
  <label><span>Show</span><select id="target"><option value="all">All agents</option></select></label>
  <script>
    let ws, uuid, settings = {};
    const select = document.getElementById("target");
    function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
      uuid = inUUID;
      settings = JSON.parse(actionInfo).payload.settings ?? {};
      ws = new WebSocket(`ws://127.0.0.1:${port}`);
      ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
      ws.onmessage = (e) => {
        const { event, payload } = JSON.parse(e.data);
        if (event !== "sendToPropertyInspector") return;
        select.innerHTML = payload.options.map((o) => `<option value="${o.value}">${o.label}</option>`).join("");
        select.value = settings.target ?? "all";
      };
    }
    select.onchange = () => {
      settings.target = select.value;
      ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
    };
  </script>
</body></html>
